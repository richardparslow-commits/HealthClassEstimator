name: Streamlit canary

# Streamlit Community Cloud installs what the deployed repository's
# requirements.txt allows and upgrades on its own schedule, so an API removed
# upstream can take the live app down with no change in this repository. That is
# not hypothetical: st.components.v1.html was announced for removal after
# 2026-06-01, a date already past, and the deployed wrapper still called it.
#
# deploy-streamlit.yml runs the live check on every push, but always against the
# version requirements.txt pins — so it can see an API that the *pinned* Streamlit
# removes, never one that lands in a release the pin currently excludes. The next
# ceiling lift is where that would show up, too late to react.
#
# This canary asks the other question on a schedule: install the newest Streamlit
# published to PyPI, deliberately ignoring the deployed ceiling, and run the same
# live check against the pair the deployed repository serves right now. A failure
# means the wrapper needs changing before the ceiling moves, or that the ceiling
# must stay. A pass means an upgrade is safe as far as this check can tell.
#
# A pass is only worth something if it can change what ships. So a green run whose
# installed release sits above the deployed ceiling also opens a pull request that
# raises the ceiling in the deployed requirements.txt and links this run, and a
# green run that stays inside the ceiling does nothing — there is no lift to
# review. The decision, the new pin and the text of the review are all computed by
# scripts/streamlit-ceiling.js, so this workflow never restates them, and a
# summary line cannot disagree with the pull request it describes.
#
# It needs no secret and pushes nothing: the deployed repository is publicly
# readable, which Streamlit Cloud requires anyway. Dispatch it by hand with
# channel "prerelease" to probe a release candidate before it ships as stable.
#
# A scheduled workflow is disabled after 60 days without repository activity, and
# a canary that has stopped running looks exactly like one that passes. Nothing
# inside the repository can detect its own silence, so the summary reports when
# the previous canary attempt was: a large gap there is evidence the schedule was
# dark, not that every day passed.
on:
  schedule:
    # Daily, off the hour so it does not queue behind the workflows that all run
    # at :00. GitHub cron is always UTC.
    - cron: "17 6 * * *"
  workflow_dispatch:
    inputs:
      channel:
        description: Which Streamlit builds to install
        type: choice
        options:
          - latest
          - prerelease
        default: latest
      self_test:
        description: Tamper the fetched pair so the failure path (red canary + tracking issue) is exercised on purpose
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  canary:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    env:
      # github.event rather than the inputs context: a scheduled run passes no
      # inputs, and this form is defined for every trigger.
      CHANNEL: ${{ github.event.inputs.channel || 'latest' }}
      SELF_TEST: ${{ github.event.inputs.self_test || 'false' }}
      DEPLOYED_REPO: richardparslow-commits/health_app.py
    outputs:
      installed: ${{ steps.install.outputs.version }}
      channel: ${{ steps.install.outputs.channel }}
      deployed_sha: ${{ steps.fetch.outputs.sha }}
      verdicts: ${{ steps.check.outputs.verdicts }}
      ceiling_needed: ${{ steps.ceiling.outputs.needed }}
    steps:
      - name: Check out HealthClassEstimator
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      # The pair under test is the one Streamlit Cloud is serving, fetched from
      # the deployed repository rather than rebuilt here: a canary that tested a
      # local build would answer for code that is not live.
      - name: Fetch the deployed pair
        id: fetch
        run: |
          if ! git clone --quiet --depth 1 --single-branch \
               "https://github.com/${DEPLOYED_REPO}.git" streamlit-app; then
            echo "::error::Could not fetch ${DEPLOYED_REPO}. It must stay publicly readable for the canary (and for Streamlit Cloud) to see what is live."
            exit 1
          fi
          sha=$(git -C streamlit-app rev-parse --short HEAD)
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "Testing ${DEPLOYED_REPO} at $(git -C streamlit-app rev-parse HEAD)"

      # A missing version file would otherwise surface as setup-python's own
      # "no file found", which does not say what to add or where. The deployed
      # repository owns the declaration; this workflow only honours it.
      - name: Require the deployed repository to declare its interpreter
        run: |
          if [ ! -f streamlit-app/.python-version ]; then
            echo "::error::richardparslow-commits/health_app.py has no .python-version, so the canary cannot exercise the interpreter the deployment runs. Add a file named .python-version containing 3.12 (see that repository's README), then re-run."
            exit 1
          fi
          echo "Deployed interpreter: $(cat streamlit-app/.python-version)"

      # The same interpreter the deployed repository declares, and therefore the
      # same one the deploy workflow uses: the wrapper is exercised through the
      # real library rather than stubbed, so the interpreter is part of what is
      # being tested. setup-python reads the deployment's own file, so there is no
      # second copy of the version here to drift from it.
      - name: Set up the declared Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version-file: streamlit-app/.python-version

      # A failure path that has never run is a claim, not a check. This plants a
      # one-byte edit in the fetched copy on request, so the red job and the
      # tracking issue can be seen working rather than assumed.
      - name: Tamper the fetched pair (self-test only)
        if: ${{ env.SELF_TEST == 'true' }}
        run: |
          printf 'X' >> streamlit-app/app_embedded.html
          echo "::warning::Self-test: the fetched artifact was tampered with on purpose, so this run is expected to fail and to file the tracking issue."

      # `--pre` is only ever used on an explicit dispatch: a release candidate can
      # legitimately differ from the release it becomes, so a scheduled red has to
      # mean something a stable release actually did.
      - name: Install the newest Streamlit
        id: install
        run: |
          set -o pipefail
          if [ "${CHANNEL:-latest}" = "prerelease" ]; then
            channel=(--pre)
          else
            channel=()
          fi
          python -m pip install --quiet --disable-pip-version-check \
            --upgrade "${channel[@]}" streamlit 2>&1 | tee canary-install.log
          version=$(python -c "import streamlit; print(streamlit.__version__)")
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "channel=${CHANNEL:-latest}" >> "$GITHUB_OUTPUT"
          echo "Newest Streamlit on the ${CHANNEL:-latest} channel: $version"

      # The same check the deploy workflow runs, against a version that workflow
      # never installs. Its exit status is the canary's verdict.
      - name: Exercise the deployed wrapper in the newest Streamlit
        id: check
        run: |
          set -o pipefail
          status=0
          python scripts/verify-streamlit-live.py streamlit-app 2>&1 | tee canary-check.log || status=$?
          # Carried out of this step as an output, so the tracking issue can name
          # the case that failed instead of pointing at a log.
          {
            echo "verdicts<<CANARY_VERDICTS_EOF"
            grep -E '^  (PASS|FAIL)|^[0-9]+/[0-9]+ cases' canary-check.log || true
            echo "CANARY_VERDICTS_EOF"
          } >> "$GITHUB_OUTPUT"
          exit "$status"

      # Whether this green run argues for moving the ceiling is a decision, not a
      # sentence in a log: scripts/streamlit-ceiling.js reads the deployed pin and
      # the version that just passed, and the propose-ceiling job acts on its
      # answer. Only the stable channel is asked: a release candidate can differ
      # from the release it becomes, so it must not widen a range.
      - name: Decide whether the ceiling should move
        id: ceiling
        if: ${{ steps.check.outcome == 'success' && env.CHANNEL == 'latest' && env.SELF_TEST != 'true' }}
        env:
          INSTALLED: ${{ steps.install.outputs.version }}
        run: |
          set -o pipefail
          node scripts/streamlit-ceiling.js \
            --requirements streamlit-app/requirements.txt \
            --installed "$INSTALLED" \
            --json > ceiling.json
          cat ceiling.json
          needed=$(jq -r '.needed' ceiling.json)
          echo "needed=$needed" >> "$GITHUB_OUTPUT"
          # One line, carried to the summary step rather than written here: the
          # summary has a heading, and a bullet appended before it would read as
          # an orphan.
          {
            echo "line<<CEILING_LINE_EOF"
            jq -r 'if .needed then "lift warranted, " + .from + " -> " + .to + " (the proposal job opens the review)" else "no lift — " + .reason end' ceiling.json
            echo "CEILING_LINE_EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Publish the canary to the run summary
        if: ${{ always() }}
        env:
          INSTALLED: ${{ steps.install.outputs.version }}
          DEPLOYED_SHA: ${{ steps.fetch.outputs.sha }}
          CEILING: ${{ steps.ceiling.outputs.line }}
        run: |
          previous=$(gh run list --workflow streamlit-canary.yml --limit 2 \
            --json createdAt --jq '.[1].createdAt // empty' 2>/dev/null || true)
          # The pin relation is printed by the live check itself rather than
          # restated here from a second copy of the same comparison, and lifted out
          # of the details block because it is the line that says whether a green
          # run is early warning or already the real thing.
          pin=$(grep -i "deployed pin:" canary-check.log 2>/dev/null | sed 's/^ *//' || true)
          {
            echo "### Streamlit canary"
            echo
            echo "- Deployed: \`${DEPLOYED_REPO}\` at \`${DEPLOYED_SHA:-unknown}\`"
            echo "- Channel: \`${CHANNEL:-latest}\`"
            echo "- Installed: \`${INSTALLED:-not installed}\`"
            echo "- ${pin:-Pin relation: not reported (the live check did not reach it)}"
            echo "- Ceiling: ${CEILING:-not decided (the live check did not pass on the stable channel)}"
            echo "- Previous canary attempt: ${previous:-none recorded}"
            if [ "${SELF_TEST:-false}" = "true" ]; then
              echo "- Self-test: the fetched pair was tampered with on purpose, so a red canary here is the expected result."
            fi
            echo
            echo "<details><summary>Live check output</summary>"
            echo
            echo '```'
            cat canary-check.log 2>/dev/null || echo "The live check did not run."
            echo '```'
            echo
            echo "</details>"
          } >> "$GITHUB_STEP_SUMMARY"

  # The ceiling lift is a review, so this job proposes one instead of pushing. The
  # branch name is stable, so a later green run adds to the open review rather than
  # opening a second one for the same lift: the diff a person is asked to approve
  # should be one diff.
  #
  # It needs a token because the deployed repository is a different repository.
  # The canary job deliberately does not: its verdict is about the app, and a
  # missing secret must not make a working release look broken. This job exists
  # only to open the review, so a warranted lift that could not be proposed fails
  # here rather than passing quietly — the same reasoning as the deploy
  # workflow's token gate.
  propose-ceiling:
    name: Propose the ceiling lift as a pull request
    runs-on: ubuntu-latest
    needs: canary
    if: ${{ needs.canary.result == 'success' && needs.canary.outputs.ceiling_needed == 'true' }}
    permissions:
      contents: read
    env:
      STREAMLIT_PUSH_TOKEN: ${{ secrets.STREAMLIT_PUSH_TOKEN }}
      DEPLOYED_REPO: richardparslow-commits/health_app.py
      BRANCH: canary/streamlit-ceiling
    steps:
      - name: Check out HealthClassEstimator
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20

      - name: Fail when a warranted lift cannot be proposed
        if: ${{ env.STREAMLIT_PUSH_TOKEN == '' }}
        env:
          INSTALLED: ${{ needs.canary.outputs.installed }}
        run: |
          echo "::error::The canary passed on Streamlit $INSTALLED, above the deployed ceiling, but STREAMLIT_PUSH_TOKEN is not set, so no pull request could be opened in ${DEPLOYED_REPO}. Add a token with Contents and Pull requests read/write on that repository as the STREAMLIT_PUSH_TOKEN secret, then re-run this workflow — or raise the ceiling by hand."
          exit 1

      - name: Check out the deployed repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: richardparslow-commits/health_app.py
          token: ${{ env.STREAMLIT_PUSH_TOKEN }}
          path: streamlit-app

      # The review describes what the pull request actually changes, so the pin is
      # read from the deployed repository's default branch — not from the branch
      # this job reuses. A second green run for a newer release therefore replaces
      # the proposal rather than adding a stale one beside it: the diff stays one
      # base-to-target change, and the text keeps naming that same change.
      - name: Put the lift on a branch
        env:
          INSTALLED: ${{ needs.canary.outputs.installed }}
          DEPLOYED_SHA: ${{ needs.canary.outputs.deployed_sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          base=$(git -C streamlit-app symbolic-ref --quiet --short HEAD 2>/dev/null || true)
          if [ -z "$base" ]; then base=main; fi
          echo "base=$base" >> "$GITHUB_ENV"
          # The default branch as checked out, before this job switches branches.
          cp streamlit-app/requirements.txt deployed-requirements.txt
          node scripts/streamlit-ceiling.js \
            --requirements deployed-requirements.txt \
            --installed "$INSTALLED" \
            --json --body ceiling-pr.md \
            --run-url "$RUN_URL" \
            --deployed-repo "$DEPLOYED_REPO" \
            --deployed-sha "$DEPLOYED_SHA" > ceiling.json
          cat ceiling.json
          echo "pr_title=$(jq -r '.title' ceiling.json)" >> "$GITHUB_ENV"
          echo "needed=$(jq -r '.needed' ceiling.json)" >> "$GITHUB_ENV"
          cd streamlit-app
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git ls-remote --exit-code --heads origin "$BRANCH" >/dev/null 2>&1; then
            git fetch --quiet origin "$BRANCH"
            git checkout --quiet -B "$BRANCH" "origin/$BRANCH"
            echo "Adding to the branch that already carries a lift."
          else
            git checkout --quiet -b "$BRANCH"
            echo "Started the branch from $base."
          fi
          cd ..
          # Idempotent: a branch already at the target is left alone, and one that
          # carries an older ceiling is moved to this run's.
          node scripts/streamlit-ceiling.js \
            --requirements streamlit-app/requirements.txt \
            --installed "$INSTALLED" \
            --apply
          cd streamlit-app
          git add requirements.txt
          if git diff --cached --quiet; then
            echo "pushed=false" >> "$GITHUB_ENV"
            echo "The branch already carries this ceiling, so there is nothing to push."
          else
            git commit --quiet -m "Raise the Streamlit ceiling for Streamlit ${INSTALLED}"
            git push --quiet --set-upstream origin "$BRANCH"
            echo "pushed=true" >> "$GITHUB_ENV"
          fi

      - name: Open or update the pull request
        env:
          GH_TOKEN: ${{ env.STREAMLIT_PUSH_TOKEN }}
          INSTALLED: ${{ needs.canary.outputs.installed }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          existing=$(gh pr list --repo "$DEPLOYED_REPO" --head "$BRANCH" --state open \
            --json number,url --jq '.[0].url // empty')
          if [ -n "$existing" ]; then
            echo "### Ceiling lift already proposed" >> "$GITHUB_STEP_SUMMARY"
            echo "Open review: $existing" >> "$GITHUB_STEP_SUMMARY"
            echo "The lift is already open for review at $existing."
            if [ "$pushed" = "true" ]; then
              # The branch moved, so the review's own description of the diff has
              # to move with it; the comment keeps the run that moved it visible.
              gh pr edit "$existing" --repo "$DEPLOYED_REPO" --body-file ceiling-pr.md
              gh pr comment "$existing" --repo "$DEPLOYED_REPO" \
                --body "The canary passed again on Streamlit ${INSTALLED}, and this run moved the branch to the ceiling above it: ${RUN_URL}"
            fi
            exit 0
          fi
          if [ "$needed" != "true" ]; then
            echo "### Ceiling lift no longer needed" >> "$GITHUB_STEP_SUMMARY"
            echo "The deployed pin already admits Streamlit $INSTALLED, so no review was opened." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          url=$(gh pr create --repo "$DEPLOYED_REPO" --base "$base" --head "$BRANCH" \
            --title "$pr_title" --body-file ceiling-pr.md)
          echo "### Ceiling lift proposed" >> "$GITHUB_STEP_SUMMARY"
          echo "$url" >> "$GITHUB_STEP_SUMMARY"
          echo "Opened $url"

  # Same shape as the parity workflow's alert job, for the same reason: a red mark
  # on a scheduled run is easy to overlook, an open issue is not. While the canary
  # is not green this job keeps one labelled issue open — creating it on the first
  # failure, commenting on later ones — and closes it on the first run where the
  # check passes. Only a plain `success` closes it: a cancelled or skipped run
  # means the canary did not happen, which must not be read as recovery.
  alert:
    name: Report a canary failure to a tracking issue
    runs-on: ubuntu-latest
    needs: canary
    if: ${{ always() }}
    concurrency:
      group: streamlit-canary-alert
      cancel-in-progress: false
    permissions:
      contents: read
      issues: write
    env:
      DEPLOYED_REPO: richardparslow-commits/health_app.py
    steps:
      - name: Open, update or close the canary issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          OWNER: ${{ github.repository_owner }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          RESULT: ${{ needs.canary.result }}
          EVENT: ${{ github.event_name }}
          INSTALLED: ${{ needs.canary.outputs.installed }}
          CHANNEL_NAME: ${{ needs.canary.outputs.channel }}
          DEPLOYED_SHA: ${{ needs.canary.outputs.deployed_sha }}
          VERDICTS: ${{ needs.canary.outputs.verdicts }}
        run: |
          set -euo pipefail
          label=streamlit-canary

          gh label create "$label" --repo "$REPO" --force \
            --description "The newest Streamlit no longer runs the deployed estimator" \
            --color FBCA04

          open_issues=$(gh issue list --repo "$REPO" --label "$label" --state open --json number --jq '.[].number')
          # sed, not head: `printf | head` can die of SIGPIPE under pipefail.
          issue=$(printf '%s\n' "$open_issues" | sed -n '1p')

          if [ "$RESULT" != "success" ]; then
            body=$(mktemp)
            {
              printf '@%s — the Streamlit canary installed `%s` (channel `%s`) and ran the live check against `%s` at `%s`, and it did not pass.\n\n' \
                "$OWNER" "${INSTALLED:-unknown}" "${CHANNEL_NAME:-unknown}" "$DEPLOYED_REPO" "${DEPLOYED_SHA:-unknown}"
              printf -- '- Canary result: %s\n- Run: %s\n- Trigger: %s\n\n' "$RESULT" "$RUN_URL" "$EVENT"
              printf '```\n%s\n```\n\n' "${VERDICTS:-The live check produced no verdict lines; the run log has them.}"
              printf 'The deployed app stops working when Streamlit Cloud installs a release that removes an API the wrapper calls. Either teach the wrapper the new API before the ceiling moves, or keep the ceiling in the deployed `requirements.txt` below the release that breaks it — and say which in the run summary, because the next person will ask.\n\n'
              printf 'This issue closes automatically on the first canary run that passes.\n'
            } > "$body"
            if [ -z "$issue" ]; then
              gh issue create --repo "$REPO" --label "$label" \
                --title "Streamlit ${INSTALLED:-unknown} no longer runs the deployed estimator" \
                --body-file "$body"
            else
              gh issue comment "$issue" --repo "$REPO" --body-file "$body"
            fi
          elif [ -n "$issue" ]; then
            gh issue close "$issue" --repo "$REPO" --comment "Streamlit ${INSTALLED:-unknown} passes the live check against the deployed pair, so the canary is green again. Closed by the first passing run: ${RUN_URL}"
          fi
