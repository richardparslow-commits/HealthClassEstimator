name: Check the live consumers against the build

# The website and the Streamlit app each hold a copy of the built estimator, and a
# copy can be edited where it lands. Release 78 shipped a Mutual of Omaha amount
# screen that existed only inside the website's copy, so nothing in this repository
# could reproduce what an applicant saw (ISSUE-001).
#
# Both copies are compared with a fresh build here, as independent jobs, so one
# going red cannot hide the other's result:
#
#   website   — the live tool page, which delivers the build through an iframe
#               srcDoc plus its own adapters, read from the served page itself. The
#               page must be this build plus its four declared adaptations
#               (consumers/website.json), and it must state the commit its own build
#               was made from — the site's build stamps that — so the verdict names
#               the deployment it judged instead of saying only that the page
#               matched. Reading the name out of the page is also what keeps this job
#               able to run at all: it used to need a token to read the private
#               repository that publishes the page, no such token exists here, and
#               the job spent its every run reporting "no deployment read" instead of
#               judging anything. The claim that repository's *committed* copy is this
#               build belongs where that copy lives: the site's own CI reads this
#               public repository beside it and gates that copy before it is pushed.
#
#               That page answers through Cloudflare, and `no-cache, must-revalidate,
#               max-age=0` on its document is a revalidation instruction, not a
#               promise that no shared cache still holds the previous deployment.
#               So every read asks for a URL carrying a fresh nonce: a cache keyed
#               on the URL cannot hold an entry for one it has never been asked
#               for, and a run minutes after a deploy compares the deployment
#               rather than the copy the edge was still serving. A response that
#               says it came from a cache anyway is retried with a new nonce and
#               then refused — never compared, because comparing it is the answer
#               this job exists to stop being wrong.
#   streamlit — the artifact Streamlit Community Cloud renders, read from a
  #               checkout of richardparslow-commits/health_app.py pinned to one
  #               commit. That file is the build output copied verbatim, so the
  #               verdict required here is byte-identical, and its manifest must
  #               describe it; anything else means the deployed tool is not the
  #               reviewed one. The checkout is a git fetch of one commit, not a
  #               download from raw.githubusercontent.com: that CDN goes on serving
  #               the previous commit for minutes after a push, and two independent
  #               requests can even return an artifact and a manifest from two
  #               different commits. The verdict names that commit
  #               (repo@sha), so a green run says which published copy it judged
  #               rather than only which file it read.
#   runtime   — the deployed wrapper itself, exercised the way Streamlit does.
#               That repository holds no build logic: it verifies the pair it
#               serves. This job proves the contract in both directions — the
#               published pair is served byte for byte, and a tampered artifact,
#               a missing artifact, a missing manifest and a manifest whose
#               release version lies are all refused. The wrapper used to inline
#               loose assets when the artifact was absent, and that second
#               implementation of the build drifted from the reviewed one.
#
# Each job fails when the two disagree on underwriting logic — rules, state or
# engine — because then the published tool is not the tool this repository audited.
#
# A red run is a real answer, not a flake: it can also mean a copy has not been
# republished with the current build yet. A read the checker refused because a cache
# answered it is red as well, and says so instead of naming a component — nothing
# was compared, so there is nothing for that run to send anyone to republish.
# That is why this runs on a schedule and on
# demand instead of on pull requests, where a pending republish must not block
# unrelated work. When both jobs go green, both live tools and the sources agree.
#
# A red run is only useful if someone sees it, so a fourth job turns the outcome into
# a durable signal: while any comparison job is not green it keeps one labelled
# tracking issue open — created on the first failure, updated on later ones — and on
# the first run where every comparison job succeeds it comments and closes that
# issue. The issue mentions the owner, so a drifted copy reaches a human instead of a
# scheduled run failing quietly at 13:17 UTC.
on:
  schedule:
    - cron: "17 13 * * *"
  workflow_dispatch:
    inputs:
      consumer:
        description: Website URL or workspace file to compare with the build
        required: false
        default: https://lifeinsurancebrokeradvocate.com/tools/health-class-predictor
      streamlit_ref:
        description: Branch, tag or full commit SHA of streamlit_repo to verify
        required: false
        default: main
      streamlit_repo:
        description: Repository whose deployed wrapper is verified against the build
        required: false
        default: richardparslow-commits/health_app.py

permissions:
  contents: read

jobs:
  website:
    name: Live website
    runs-on: ubuntu-latest
    # What this job judged, for the alert job: the deployment the page names itself.
    # A job output survives a failed job, so a run that goes red after reading the page
    # still reports which deployment it was about — and a run that failed before it read
    # anything carries empty outputs, which the alert reads as "nothing was judged"
    # rather than as a missing commit.
    outputs:
      repo: ${{ steps.deployed.outputs.repo }}
      commit: ${{ steps.deployed.outputs.commit }}
    steps:
      - name: Check out HealthClassEstimator
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20

      - name: Build the standalone distribution
        run: npm run build

      - name: Check the parity check against its fixtures
        run: node test/parity.test.js

      # The deployment is named by the page under test. The site's build stamps the
      # commit it was made from into the page it serves, so that commit is read out of
      # the bytes a visitor gets, declared in consumers/website.json beside the page's
      # release claims. Naming the deployment used to mean fetching the page from the
      # private repository it is published from, which needs a credential this
      # repository does not have — so this job reported "no deployment read" on every
      # run instead of judging anything, and a check that cannot run is worse than the
      # claim it made. What is deliberately not dropped is the claim that the
      # *committed* copy is this build: that copy lives in the site's repository, whose
      # own CI reads this public repository beside it and gates the copy before it is
      # published, so the two repositories each answer for their own half.
      #
      # pipefail keeps a failing check from being hidden by tee. The checker puts a
      # fresh nonce in the request URL and refuses to compare an answer that came
      # from a cache, so this step cannot report on a page the deploy has replaced.
      # It also applies the page's four declared adaptations (consumers/website.json)
      # and requires the served document to begin with the result, so a page running an
      # older build fails here instead of passing with a presentational warning, and a
      # release that moves an anchor the page's generator depends on fails at release
      # time rather than when someone next regenerates the page. And a page that does
      # not state which build it is cannot be reported on at all, so that is a failure
      # with the page's own build as its fix.
      #
      # The deployment is written to this job's outputs whatever the comparison found:
      # whether a red run judged a named deployment or read nothing is the difference
      # between republishing a copy and fixing a read, and a run URL cannot say it.
      - name: Compare the live page with the build, and name the deployment it is
        id: deployed
        env:
          CONSUMER: ${{ inputs.consumer || 'https://lifeinsurancebrokeradvocate.com/tools/health-class-predictor' }}
        run: |
          set -o pipefail
          status=0
          node scripts/check-consumer-parity.js --consumer "$CONSUMER" \
            --deployment-out deployment.txt 2>&1 | tee -a parity.txt || status=$?
          # First line: the repository the declaration names. Second: the commit the
          # page stated, empty when it stated none — which the alert reports as a run
          # that read no deployment, not as a missing commit.
          repo=$(sed -n 1p deployment.txt 2>/dev/null || true)
          commit=$(sed -n 2p deployment.txt 2>/dev/null || true)
          echo "repo=$repo" >> "$GITHUB_OUTPUT"
          echo "commit=$commit" >> "$GITHUB_OUTPUT"
          exit $status

      - name: Publish the website comparison to the run summary
        if: ${{ always() }}
        run: |
          {
            echo "### Live website parity"
            echo '```'
            cat parity.txt 2>/dev/null || echo "The comparison produced no output."
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  streamlit:
    name: Streamlit artifact
    runs-on: ubuntu-latest
    # Same rule as the website: the commit this job read is what the alert reports.
    outputs:
      repo: ${{ steps.deployed.outputs.repo }}
      commit: ${{ steps.deployed.outputs.commit }}
    steps:
      - name: Check out HealthClassEstimator
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20

      - name: Build the standalone distribution
        run: npm run build

      - name: Check the parity check against its fixtures
        run: node test/parity.test.js

      # One commit, read atomically. Fetching the two files over HTTP can straddle
      # a push — that CDN keeps serving the previous commit for minutes — and an
      # artifact from one commit with a manifest from another reads as "edited
      # outside the build", sending someone to republish a copy that is already
      # correct. A fetch of one commit cannot split, and the commit it read is
      # printed so the verdict names what it looked at. A branch, a tag or a
      # commit SHA all work, so an older deploy can be checked by naming it.
      - name: Check out the deployed repository at one commit
        id: deployed
        env:
          REPO: ${{ inputs.streamlit_repo || 'richardparslow-commits/health_app.py' }}
          REF: ${{ inputs.streamlit_ref || 'main' }}
        run: |
          set -o pipefail
          git init --quiet deployed
          git -C deployed remote add origin "https://github.com/$REPO.git"
          if ! git -C deployed fetch --quiet --depth 1 origin "$REF"; then
            echo "::error::Could not fetch $REF from $REPO. Name a branch, a tag, or a full commit SHA; an abbreviated SHA is not a ref."
            exit 1
          fi
          git -C deployed checkout --quiet --detach FETCH_HEAD
          commit=$(git -C deployed rev-parse HEAD)
          echo "repo=$REPO" >> "$GITHUB_OUTPUT"
          echo "commit=$commit" >> "$GITHUB_OUTPUT"
          # The comparison below names the commit it read, the way the website job does.
          echo "DEPLOYED_STREAMLIT_REPO=$REPO" >> "$GITHUB_ENV"
          echo "DEPLOYED_STREAMLIT_COMMIT=$commit" >> "$GITHUB_ENV"
          echo "Read $REPO at $commit" | tee -a streamlit.txt
          # The manifest records the artifact's name, so the copies keep it.
          cp deployed/app_embedded.html deployed/app_embedded.manifest.json .
          echo "Read $(wc -c < app_embedded.html) bytes of artifact and $(wc -c < app_embedded.manifest.json) bytes of manifest" | tee -a streamlit.txt

      # This consumer receives the build output copied verbatim, so a
      # presentational difference is drift here, not an embed adaptation.
      # `--consumer-repo/--consumer-commit` do not compare anything extra: the bytes being
      # compared are that commit's copy, fetched by commit rather than over a CDN that can
      # serve another. They make the verdict say which published copy it was about — the
      # same question the website job answers with --deployed, asked of a file instead of
      # a page.
      - name: Require the published artifact to be the build, byte for byte
        run: |
          set -o pipefail
          node scripts/check-consumer-parity.js --consumer app_embedded.html --expect-identical \
            --consumer-repo "$DEPLOYED_STREAMLIT_REPO" \
            --consumer-commit "$DEPLOYED_STREAMLIT_COMMIT" 2>&1 | tee -a streamlit.txt

      # Byte identity alone would accept a manifest that describes something else,
      # so the artifact is also held to the record it shipped with.
      - name: Require the published manifest to describe that artifact
        run: |
          set -o pipefail
          node scripts/write-artifact-manifest.js --check app_embedded.html --out app_embedded.manifest.json 2>&1 | tee -a streamlit.txt

      - name: Publish the Streamlit comparison to the run summary
        if: ${{ always() }}
        run: |
          {
            echo "### Streamlit artifact parity"
            echo '```'
            cat streamlit.txt 2>/dev/null || echo "The comparison produced no output."
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  # The deployed repository used to carry a second implementation of this build:
  # build_app_html() inlined loose index.html/css/js assets whenever
  # app_embedded.html was absent (a local run, or a deploy where the artifact did
  # not arrive). Nothing read that path, and it drifted from the reviewed builder
  # in three places — script joins, a stylesheet re.sub that failed on a CSS
  # escape, and a loader strip that could be defeated by editing its comment. It is
  # gone: health_app.py now verifies the pair it serves and contains no build logic.
  # This job holds it to that contract, in both directions, the way Streamlit runs
  # it — the module renders at import time, so the harness stubs only the parts of
  # the Streamlit API it touches.
  streamlit-runtime:
    name: Streamlit runtime verification
    runs-on: ubuntu-latest
    # Same rule again: the wrapper is verified at one commit, and that commit is
    # what the alert names when this job is the one that went red.
    outputs:
      repo: ${{ steps.deployed.outputs.repo }}
      commit: ${{ steps.deployed.outputs.commit }}
    steps:
      - name: Check out HealthClassEstimator
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      # Same rule as the artifact job: one commit, fetched with git. Reading the
      # wrapper and its pair over HTTP can splice two commits together, which
      # verifies a combination that never shipped.
      - name: Check out the deployed repository at one commit
        id: deployed
        env:
          REPO: ${{ inputs.streamlit_repo || 'richardparslow-commits/health_app.py' }}
          REF: ${{ inputs.streamlit_ref || 'main' }}
        run: |
          set -o pipefail
          git init --quiet deployed
          git -C deployed remote add origin "https://github.com/$REPO.git"
          if ! git -C deployed fetch --quiet --depth 1 origin "$REF"; then
            echo "::error::Could not fetch $REF from $REPO. Name a branch, a tag, or a full commit SHA; an abbreviated SHA is not a ref."
            exit 1
          fi
          git -C deployed checkout --quiet --detach FETCH_HEAD
          commit=$(git -C deployed rev-parse HEAD)
          echo "repo=$REPO" >> "$GITHUB_OUTPUT"
          echo "commit=$commit" >> "$GITHUB_OUTPUT"
          mkdir -p runtime
          cp deployed/health_app.py deployed/app_embedded.html \
             deployed/app_embedded.manifest.json runtime/
          echo "Verifying $REPO at $commit"

      - name: Prove the wrapper's verification contract
        run: |
          set -o pipefail
          python3 scripts/verify-streamlit-runtime.py runtime 2>&1 | tee runtime.txt

      - name: Publish the runtime verification to the run summary
        if: ${{ always() }}
        run: |
          {
            echo "### Streamlit runtime verification"
            echo '```'
            cat runtime.txt 2>/dev/null || echo "The verification produced no output."
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  # The comparisons above read deployed copies, and the Streamlit ones used to read
  # them through raw.githubusercontent.com — a CDN that keeps serving the previous
  # commit for minutes after a push. Both now fetch one commit with git; this keeps
  # that true. It is deliberately not in the drift alert's `needs`: a workflow that
  # reaches for the CDN again is a regression in this repository, not a deployed copy
  # disagreeing with the build, and reporting it as drift would send someone to
  # republish something that is correct.
  workflows:
    name: Guard the workflow reads
    runs-on: ubuntu-latest
    steps:
      - name: Check out HealthClassEstimator
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20

      - name: Prove the guard against its fixtures
        run: npm run test:workflows

      # The alert reads the outputs this workflow declares, so the message and the
      # wiring are proved here — next to the run that will send it.
      - name: Prove the drift issue names the deployment it reports on
        run: npm run test:alert

      - name: Fail if a workflow reads a deployed copy over the CDN
        run: npm run check:workflows

  # Make a red run impossible to miss. A red mark on a scheduled run is easy to
  # overlook; an open issue is not. While any comparison job is not green this job
  # keeps one labelled tracking issue open (creating it on the first failure,
  # commenting on later ones) and closes it — with a record of the run that did it —
  # on the first run where every comparison job succeeds. Only a plain `success`
  # counts: a skipped or cancelled job means the comparison did not happen, which
  # must not close an issue.
  #
  # The text names the deployment each job judged, because that is the difference
  # between "the deploy has not published yet", "the copy is behind this build" and
  # "nothing was read at all" — three states the comparison can tell apart and a
  # run URL cannot. It is generated by scripts/parity-alert.js from `needs`, whose
  # outputs each comparison job sets as soon as it has fetched its commit (a job
  # output survives the job failing, so a red run still reports what it judged).
  alert:
    name: Report drift to a tracking issue
    runs-on: ubuntu-latest
    needs: [website, streamlit, streamlit-runtime]
    # always(): this job reports on the others' outcomes, so it has to run after a
    # failure — the very case it exists for.
    if: ${{ always() }}
    concurrency:
      group: parity-drift-alert
      cancel-in-progress: false
    permissions:
      contents: read
      issues: write
    steps:
      - name: Check out HealthClassEstimator
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20

      - name: Open, update or close the drift issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          OWNER: ${{ github.repository_owner }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          HEAD_SHA: ${{ github.sha }}
          EVENT: ${{ github.event_name }}
          RESULTS: ${{ toJSON(needs) }}
        run: |
          set -euo pipefail
          label=parity-drift

          # `result` is success, failure, cancelled or skipped; everything that is
          # not success is reported, and only "none" closes the issue. One
          # implementation of that rule, in the script that writes the text, so the
          # issue and this branch cannot disagree about whether the run was green.
          failed=$(node scripts/parity-alert.js --not-green)
          echo "Not green: ${failed}"

          gh label create "$label" --repo "$REPO" --force \
            --description "A deployed copy of the estimator disagrees with the build" \
            --color B60205

          open_issues=$(gh issue list --repo "$REPO" --label "$label" --state open --json number --jq '.[].number')
          # sed, not head: `printf | head` can die of SIGPIPE under pipefail.
          issue=$(printf '%s\n' "$open_issues" | sed -n '1p')

          if [ "$failed" != "none" ]; then
            body=$(mktemp)
            node scripts/parity-alert.js --body > "$body"
            if [ -z "$issue" ]; then
              gh issue create --repo "$REPO" --label "$label" \
                --title "Consumer parity: a deployed copy disagrees with the build" \
                --body-file "$body"
            else
              gh issue comment "$issue" --repo "$REPO" \
                --body "$(node scripts/parity-alert.js --comment)"
            fi
          elif [ -n "$issue" ]; then
            closed_comment=$(node scripts/parity-alert.js --closed-comment)
            for n in $open_issues; do
              gh issue comment "$n" --repo "$REPO" --body "$closed_comment"
              gh issue close "$n" --repo "$REPO"
            done
          else
            echo "No open tracking issue to close."
          fi

          {
            echo "### Drift alert"
            echo "Not green: ${failed}"
            echo "Open tracking issue at start: ${issue:-none}"
            echo "Deployments judged:"
            node scripts/parity-alert.js --deployments
          } >> "$GITHUB_STEP_SUMMARY"
