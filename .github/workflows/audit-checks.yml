name: Verify underwriting changes
# Every branch, main included. This used to exclude main on the assumption that main
# changes arrive as pull requests, and the last merged one was on 2026-10-10: from
# then the suite that verifies the release machinery ran nowhere it could fail a
# release, and the browser suite below was invoked by nothing at all. A run here is
# what makes "the checks pass" a statement about the branch that ships, and
# `npm run test:coverage` is the guard that keeps that true.
on:
  pull_request:
  push:
  # Dispatchable so the CI self-test (`.github/workflows/self-test.yml`) can run this
  # suite once in Actions and read its step record back: the point is not the code but
  # GitHub's execution of it — checkout, expression evaluation, and every step running.
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Source-derived underwriting checks
        run: npm test
      - name: Build standalone distribution
        run: npm run build
      - name: Validate embedded script order and version
        run: node test/build.test.js
      # The manifest is what the deployed repository verifies before it serves
      # anything; its writer is fixture-tested here as well as in the release workflow.
      - name: Verify the manifest writer against its fixtures
        run: npm run test:manifest
      # Offline fixtures for the consumer parity check: they prove the check can
      # tell a consumer's embed adaptations from a fork of the underwriting rules.
      - name: Verify the consumer parity check itself
        run: node test/parity.test.js
      # The drift issue is the only thing anyone sees when a scheduled parity run
      # goes red, and its job is to name the deployment that was judged. Its text is
      # generated by a script and fixture-tested here, because a notification that
      # drops the commit — or invents one for a job that never read it — is a bug in
      # the message, invisible to the comparison.
      - name: Verify the drift issue names the deployment it reports on
        run: npm run test:alert
      # The deployed copies used to be read with raw.githubusercontent.com, which
      # serves the previous commit for minutes after a push. Both parity jobs now
      # fetch one commit with git, and this refuses to let a workflow reach for the
      # CDN again — a regression here is invisible until a run moments after a
      # deploy reports on the release before it. The fixtures prove it fires on a
      # read and stays quiet on a comment that explains the bug.
      - name: Verify no workflow reads a deployed copy over the CDN
        run: npm run test:workflows
      # The canary's ceiling decision edits a requirements file in another
      # repository, so the decision and the review text are fixture-tested before
      # any run can act on them — including the cases where it must decline.
      - name: Verify the Streamlit ceiling decision and its wiring
        run: npm run test:ceiling
      # The deployed app's interpreter is declared once and read by these
      # workflows, so the declaration and the ways it can disagree with a run are
      # fixture-tested rather than trusted.
      - name: Verify the deployed interpreter declaration
        run: npm run test:pin
      # The deployed-app issue is the only thing anyone sees when the six-hourly
      # browser check goes red, and it has to tell a sleeping app from a browser that
      # never installed — or from an app whose gate led nowhere. Its verdict, its text
      # and its workflow wiring are offline fixtures, so they run here rather than in
      # the job that downloads Chromium.
      - name: Verify the deployed-app alert reports the verdict it read
        run: npm run test:deployed-alert
      # The suite above holds the decision and the workflow's text; this executes the
      # alert job's own shell against a `gh` that records what it was asked to do. The
      # step is the last hop between a red six-hourly check and a person, and the
      # deployed app is red today (release 80 against a newer build), so whether the
      # issue is opened has to be something this repository has watched happen.
      - name: Verify the alert job's shell opens, updates and closes the issue
        run: npm run test:alert-step
      # The release's gates and its push, run against a local bare repository playing the
      # deployed one. The read-back beneath them was already fixture-tested; what was only
      # read was the shell that decides whether a release happens — the `cmp` gate, the
      # staging copy, the refusal to publish a repository that rebuilds the estimator, and
      # the commit whose message links the deployed commit to its source. A release
      # workflow is the one place where reading instead of running is most expensive.
      - name: Verify the release gates and push against a local remote
        run: npm run test:publish-step
      # A release that cannot publish used to spend its whole run finding that out: the
      # credential gate was the last step of the job, so the build, the CSS audit, the
      # runtime harness and the staging copy all happened before it, and a credential that
      # existed but was read-only, revoked or for another repository was found only at the
      # push. Those two checks now run before anything is built, and this executes them —
      # including the refusals, which are server answers no local remote produces, so the
      # suite answers them the way the server does and records the argv it was handed.
      - name: Verify the release proves its credential before it builds
        run: npm run test:preflight
      # The release refuses in seconds, which only helps a release. A key revoked between
      # releases is invisible until one needs it, so a daily workflow asks the same script
      # the same question and files an issue while the answer is no. This executes the
      # check against a real remote and the alert step against a stubbed `gh` — the issue
      # is the only thing anybody sees, and "it is opened" has to be something this
      # repository has watched happen.
      - name: Verify the credential check and the issue it files
        run: npm run test:credential
      # The gates and the push are run above; this runs what the run then *says*. The
      # read-back invocation (which commit it expects, from which remote, and whether a
      # failure stops the step), the token gates, and the run summary are what a person
      # reads as "published" — and the shape that matters is a green run whose deployment
      # still serves the previous build, which only that text distinguishes.
      - name: Verify the release read-back, gates and summary against a local remote
        run: npm run test:publish-claim
      # The suite above runs a step's shell, but GitHub decides whether to run it at all
      # from the step's `if:`. Until this existed that decision was matched as text, so
      # a gate naming the wrong variable, or an `&&` where `||` was meant, passed while
      # the step it guarded never ran. The conditions are now evaluated against the
      # job's own variables in every run shape, and every `if:` in every workflow has to
      # parse, so a condition nobody can read is a failure rather than a step nobody
      # judged.
      - name: Verify the workflow conditions decide the run shapes they claim
        run: npm run test:condition
      # The self-test dispatches the release and this suite and holds each run's own
      # step record to what the conditions claim; its fixtures play the API with a fake
      # `gh`, because the real one only answers inside a run.
      - name: Verify the CI self-test against the API's answers
        run: npm run test:self-test
      # The suites above are only checks if something runs them where a release can
      # see them: every `test*` script must be invoked by a workflow triggered by a
      # push to main, and this also reports which workflow does it for each.
      - name: Verify every suite runs when main changes
        run: npm run check:workflow-coverage
      - name: Verify the coverage guard against its fixtures
        run: npm run test:coverage
      # The publish read-back is offline, like every check above: it belongs here and
      # not in the job below, whose first step downloads a browser — a suite that only
      # runs when that download succeeds reports nothing on the day it fails. (It was
      # in there for one run, which is how the misplacement was noticed.)
      - name: Verify the publish read-back
        run: npm run test:published

  # The interview is the product, and the browser suite is the only check that
  # exercises it as an applicant does — the acknowledgment gate, the section walk,
  # the probation screen, the AF-plus-prescription exception, mobile layout, saved-
  # state migration and the embedded build. It ran nowhere in CI before: the workflow
  # that should have run it excluded main. Its own job because it downloads a browser,
  # which must not delay the checks above or hide their results if it fails.
  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      # Deliberately not saved into package.json: the shipped app has no runtime or
      # build dependencies, and a test-only browser should not become one.
      - name: Install Playwright and Chromium
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium
      # The suite visits /dist/app.html to check the deployment build it ships.
      - name: Build the single-file distribution
        run: npm run build
      - name: Exercise the interview in a real browser
        run: npm run test:ui
      # Fixtures for the check that loads the deployed app. It sits here because it
      # needs the browser above, and its subject is the deployment rather than the
      # build: a local page can be stale in ways the published app is not, and the
      # live app nests the estimator one frame deeper than any fixture assumed until
      # 2026-10-17. It also serves this build with its interview script taken out — the
      # copy that passed the check before it took the gate — so a regression in that
      # judgement fails here, on a branch, rather than six hours later against a
      # service nobody can use. Running it every branch keeps the check honest on the
      # day the scheduled workflow goes red.
      - name: Verify the deployed-app check against its fixtures
        run: npm run test:deployed
