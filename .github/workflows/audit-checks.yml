name: Verify underwriting changes
on:
  pull_request:
  push:
    branches-ignore: [main]
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Source-derived underwriting checks
        run: npm test
      - name: Build standalone distribution
        run: npm run build
      - name: Validate embedded script order and version
        run: node test/build.test.js
      # The manifest is what the deployed repository verifies before it serves
      # anything; its writer is fixture-tested here as well as in the release workflow.
      - name: Verify the manifest writer against its fixtures
        run: npm run test:manifest
      # Offline fixtures for the consumer parity check: they prove the check can
      # tell a consumer's embed adaptations from a fork of the underwriting rules.
      - name: Verify the consumer parity check itself
        run: node test/parity.test.js
