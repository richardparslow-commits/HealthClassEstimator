name: Deploy Streamlit app

# On every push to the main branch (and on manual dispatch), run the engine
# test suite, build the self-contained single-file HTML and the manifest that
# describes it, and push exactly those two files into the
# richardparslow-commits/health_app.py repo. Streamlit Community Cloud watches
# that repo and redeploys on push, so the push IS the deploy trigger. The
# deployed repository holds nothing else: it verifies the pair before serving
# it, and the loose index/css/js copies it used to receive — and inline as a
# second implementation of this build — are deleted by the sync below.
#
# The pair that ships is compared byte for byte with the build the checks judged,
# and after the push the branch head is read back from origin and compared again,
# so a run that says "published" names the commit Streamlit Cloud will serve.
#
# Dispatching with `verify_published` runs that read-back on its own — origin's
# current main against this build, pushing nothing — so the deployed copy can be
# judged from CI without the token, including after a hand sync.
#
# Required setup: create a personal access token with "Contents: read/write"
# scope on richardparslow-commits/health_app.py and add it to this repo's
# secrets as STREAMLIT_PUSH_TOKEN. The token is only needed to push: staging the
# deployed repository and verifying the pair happen on every run, so the steps
# that decide whether a pair may ship are exercised whether or not it is set.
# On main, a run without the secret still fails at the token gate, so a release
# can never look published when it is not.
#
# NB: the `secrets` context cannot be read inside `if:` expressions, so the
# token is mapped to a job-level `env` var and the steps test `env.X` instead.
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      # Push runs exercise the read-back only once the token exists. Until then,
      # and for a copy synced by hand, this is how the deployed commit gets read
      # back and judged without publishing anything — the same comparison, with
      # origin's current main as the subject instead of a commit this run pushed.
      verify_published:
        description: "Read the deployed repository's current main back and check it is this build (pushes nothing; works without the token)"
        type: boolean
        default: false

concurrency:
  group: deploy-streamlit
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      STREAMLIT_PUSH_TOKEN: ${{ secrets.STREAMLIT_PUSH_TOKEN }}
      VERIFY_PUBLISHED: ${{ inputs.verify_published }}
    steps:
      - name: Check out HealthClassEstimator
        uses: actions/checkout@v4

      # Staging needs no credentials — the deployed repository is publicly
      # readable, which Streamlit Community Cloud requires anyway. Gating this on
      # the token meant the sync, the no-rebuild invariant and the pair
      # verification below had only ever run by hand, so CI could not answer
      # whether a pair was fit to publish. Only the push needs the secret.
      #
      # It comes first because the deployed repository declares the interpreter:
      # setup-python below reads streamlit-app/.python-version, so CI runs the
      # version this repository ships rather than a second copy of it in YAML.
      - name: Check out streamlit repo for staging (no token needed)
        if: ${{ env.STREAMLIT_PUSH_TOKEN == '' }}
        run: |
          if ! git clone --quiet --depth 1 --single-branch \
               https://github.com/richardparslow-commits/health_app.py.git streamlit-app; then
            echo "::error::Could not stage richardparslow-commits/health_app.py without a token. The repository must stay publicly readable; otherwise set STREAMLIT_PUSH_TOKEN."
            exit 1
          fi
          echo "Staged $(git -C streamlit-app rev-parse HEAD) for verification"

      - name: Check out streamlit repo (health_app.py)
        if: ${{ env.STREAMLIT_PUSH_TOKEN != '' }}
        uses: actions/checkout@v4
        with:
          repository: richardparslow-commits/health_app.py
          token: ${{ env.STREAMLIT_PUSH_TOKEN }}
          path: streamlit-app

      # A missing version file would otherwise surface as setup-python's own
      # "no file found", which does not say what to add or where. The deployed
      # repository owns the declaration; this workflow only honours it.
      - name: Require the deployed repository to declare its interpreter
        run: |
          if [ ! -f streamlit-app/.python-version ]; then
            echo "::error::richardparslow-commits/health_app.py has no .python-version, so this workflow cannot know which interpreter the deployment runs. Add a file named .python-version containing 3.12 (see that repository's README), then re-run."
            exit 1
          fi
          echo "Deployed interpreter: $(cat streamlit-app/.python-version)"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      # Streamlit's own runtime is exercised below, so it needs a real Python —
      # the one the deployed repository declares, not one named here.
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version-file: streamlit-app/.python-version

      - name: Run engine test suite
        run: npm test

      - name: Build the artifact and its manifest
        run: npm run release:artifact

      # Dead CSS ships inside every embedded copy, so it is checked before anything
      # is published. The audit verifies dist/app.html inlines the sheet it judged,
      # which is why the default build runs first.
      - name: Check the stylesheet for unreachable rules
        run: |
          npm run build
          npm run test:css

      # An embed that still needs external files loads nothing inside a consumer's
      # iframe, so the builder's own guards are exercised before anything publishes.
      - name: Check the builder's end-of-build guards
        run: npm run test:builder

      # The manifest is what the deployed repository verifies before it serves
      # anything, so one that records the wrong thing would publish as confidently
      # as a right one. Its writer is fixture-tested before either can ship.
      - name: Check the manifest writer
        run: npm run test:manifest

      # Two builds, one pair: `release:artifact` wrote the files that ship and
      # `npm run build` wrote the copy every check above judged. They come from the
      # same sources and agree today, but nothing asserted it, so a divergence
      # would have been published first and found by the next scheduled parity run
      # — against a live copy, a day later. Compare the bytes before either moves.
      - name: Refuse to publish an artifact the tests did not judge
        run: |
          if ! cmp -s app_embedded.html dist/app.html; then
            echo "::error::app_embedded.html (the pair that ships) differs from dist/app.html (the build the CSS, builder and manifest checks judged). Both are built from the same sources in this run, so one of them is not what was reviewed; nothing has been pushed. Re-run the workflow, and if it happens again, compare the two files — the difference is the bug."
            sha256sum app_embedded.html dist/app.html
            exit 1
          fi
          echo "The pair to publish is the build the checks judged."

      - name: Sync the artifact and its manifest into streamlit repo
        run: |
          cp app_embedded.html app_embedded.manifest.json streamlit-app/
          # The deployed repository holds no build inputs and no second
          # implementation of the build: the loose copies it used to receive are
          # removed, so nothing there could be inlined instead of the artifact.
          rm -rf streamlit-app/index.html streamlit-app/css streamlit-app/js

      - name: Refuse to publish a repository that rebuilds the estimator
        run: |
          if grep -q "def build_app_html" streamlit-app/health_app.py; then
            echo "::error::streamlit-app/health_app.py still implements the embedded build — the deployed repository must verify the artifact, not rebuild it."
            exit 1
          fi
          echo "streamlit-app/health_app.py holds no build implementation."

      # Verify the pair the way the deployed app does, before it can be pushed:
      # it must load and be served byte for byte, and a tampered copy must be refused.
      - name: Verify the pair the way the deployed app does
        run: |
          set -o pipefail
          python3 scripts/verify-streamlit-runtime.py streamlit-app 2>&1 | tee verified.txt

      # The stubbed harness proves the verification logic against a fake Streamlit
      # API, which cannot see an API the real library has scheduled for removal:
      # st.components.v1.html was one, and an upgrade would have broken the
      # deployed app with no change in this repository. This runs the staged app
      # through Streamlit's own runtime.
      - name: Exercise the staged app in Streamlit's real runtime
        run: |
          set -o pipefail
          python -m pip install --quiet --disable-pip-version-check -r streamlit-app/requirements.txt
          python scripts/verify-streamlit-live.py streamlit-app 2>&1 | tee -a verified.txt

      - name: Publish the verification to the run summary
        if: ${{ always() }}
        run: |
          {
            echo "### Staged pair verification"
            echo '```'
            cat verified.txt 2>/dev/null || echo "The verification produced no output."
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Commit and push (triggers Streamlit Cloud redeploy)
        if: ${{ env.STREAMLIT_PUSH_TOKEN != '' }}
        env:
          SOURCE_SHA: ${{ github.sha }}
        run: |
          cd streamlit-app
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to deploy - streamlit repo already current."
          else
            git commit -m "Sync from HealthClassEstimator ${SOURCE_SHA:0:7}"
            git push
          fi

      # The push is the deploy, but a push is not evidence of what it left behind:
      # it can land on a commit this run does not think it pushed, or be superseded
      # (concurrency cancels in progress). This reads the branch head back from
      # origin, requires it to be the commit just pushed, clones that commit, and
      # compares the published artifact byte for byte with the one built here (the
      # manifest is judged by its own writer's --check, since its commit and build
      # time are provenance rather than content) — then runs the deployed
      # repository's own pair verifier on the copy origin holds. That is what makes
      # the run summary's "published" a claim about this build.
      - name: Read back what the deployed repository now holds
        if: ${{ env.STREAMLIT_PUSH_TOKEN != '' || env.VERIFY_PUBLISHED == 'true' }}
        env:
          DEPLOYED_REPO: richardparslow-commits/health_app.py
        run: |
          set -o pipefail
          # A push run judges the commit it pushed; a verify-only run has pushed
          # nothing, so origin's current main is the subject — which is the point
          # of dispatching it after a hand sync.
          expect=()
          if [ -n "$STREAMLIT_PUSH_TOKEN" ]; then
            expect=(--expect "$(git -C streamlit-app rev-parse HEAD)")
          fi
          scripts/verify-published-pair.sh \
            --remote "https://github.com/${DEPLOYED_REPO}.git" \
            --branch main \
            "${expect[@]}" \
            --into published \
            --commit-out published-commit.txt 2>&1 | tee published.txt
          python3 scripts/verify-streamlit-runtime.py published 2>&1 | tee -a published.txt

      # A green run must never imply a deploy that did not happen. Before this
      # gate existed the workflow warned and exited 0 without pushing, so a
      # release could look shipped while Streamlit still served the old build.
      - name: Fail when the deploy token is not configured (main)
        if: ${{ env.STREAMLIT_PUSH_TOKEN == '' && env.VERIFY_PUBLISHED != 'true' && github.ref == 'refs/heads/main' }}
        run: |
          echo "::error::STREAMLIT_PUSH_TOKEN is not set, so richardparslow-commits/health_app.py was NOT updated and this release is not live. Create a PAT with Contents read/write on that repository, add it as the STREAMLIT_PUSH_TOKEN secret, then re-run this workflow."
          exit 1

      - name: Explain the skipped push on a non-main ref
        if: ${{ env.STREAMLIT_PUSH_TOKEN == '' && github.ref != 'refs/heads/main' }}
        run: |
          echo "::warning::STREAMLIT_PUSH_TOKEN is not set. The engine suite ran and the single-file HTML was built, but nothing was pushed. Only runs on main are required to deploy; this run is on ${{ github.ref }}."

      - name: Summarise what this run published
        if: ${{ always() }}
        env:
          SOURCE_SHA: ${{ github.sha }}
        run: |
          if [ -n "$STREAMLIT_PUSH_TOKEN" ]; then
            PUBLISHED_SHA="$(cat published-commit.txt 2>/dev/null || true)"
            {
              echo "### Published"
              if [ -n "$PUBLISHED_SHA" ]; then
                echo "Deployed commit: \`${PUBLISHED_SHA}\` in richardparslow-commits/health_app.py — read back from origin after the push and compared byte for byte with \`dist/app.html\` and the manifest this run wrote; Streamlit Community Cloud redeploys on that push."
              else
                echo "The push reported success but no commit was read back, so this run cannot name what is live. See the read-back step for why."
              fi
              echo
              echo '```'
              cat published.txt 2>/dev/null || echo "The read-back produced no output."
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          elif [ "$VERIFY_PUBLISHED" = "true" ]; then
            {
              echo "### Verified, not published"
              echo "No deploy token was configured, so this run pushed nothing; it read the deployed repository's current main back and judged it against this build."
              echo
              echo '```'
              cat published.txt 2>/dev/null || echo "The read-back produced no output."
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "### Not published" >> "$GITHUB_STEP_SUMMARY"
            echo "No deploy token was configured, so nothing was pushed. The artifact built by this run is not live, though it was staged and verified against the deployed wrapper.\n\nExpected commit message in the deployed repository: \`Sync from HealthClassEstimator ${SOURCE_SHA:0:7}\`." >> "$GITHUB_STEP_SUMMARY"
          fi
