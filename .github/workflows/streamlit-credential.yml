name: Check the publish credential

# The release refuses in seconds when its credential is missing or refused, so a release
# is no longer how this repository finds out. That closes one case, not the other: a key
# that is revoked, rotated, or replaced with a read-only one between releases is invisible
# until a release needs it — and while nothing is being released, "until a release needs
# it" is a quiet stretch in which nobody would notice at all.
#
# So this asks the same question every day, on the same script the release runs:
# `scripts/verify-push-credential.sh`. It builds nothing and pushes nothing — it asks
# GitHub to authorise a push to a scratch ref with `git push --dry-run`, and GitHub
# receives nothing — so a read-only key is caught here even though reading the repository
# would succeed, and a green run cannot have changed anything.
#
# A red check is not a red deployment. What it means is that the next release could not
# publish, which is worth knowing before somebody is waiting for one. One labelled issue
# stays open while the check is red and closes on the first run that passes, the same
# shape as the deployed-app check's alert, and its text names the refusal the check
# reported — read-only, revoked, another repository, not a key, a rejected token, or no
# credential at all — because those have different fixes.

on:
  schedule:
    # 09:40 UTC: off the hour, and clear of the other schedules — the deployed-app check
    # at 00/06/12/18:23, the canary at 06:17, consumer parity at 13:17, the release's own
    # read-back at 07:20. GitHub disables a schedule after 60 days without repository
    # activity, so a long silence still needs a dispatch.
    - cron: "40 9 * * *"
  workflow_dispatch:

concurrency:
  # Not cancel-in-progress: a run that is asking GitHub a question should finish and
  # report, and these are a minute each.
  group: publish-credential
  cancel-in-progress: false

jobs:
  credential:
    runs-on: ubuntu-latest
    # What the alert reports on. The check's own verdict is reduced to these by the script
    # that also writes the issue, so the notification and the refusal cannot disagree.
    outputs:
      code: ${{ steps.report.outputs.code }}
      detail: ${{ steps.report.outputs.detail }}
      error: ${{ steps.report.outputs.error }}
    steps:
      - uses: actions/checkout@v4

      - name: Ask GitHub whether this repository can still publish
        id: verify
        env:
          DEPLOYED_REPO: richardparslow-commits/health_app.py
          STREAMLIT_DEPLOY_KEY: ${{ secrets.STREAMLIT_DEPLOY_KEY }}
          STREAMLIT_PUSH_TOKEN: ${{ secrets.STREAMLIT_PUSH_TOKEN }}
          CREDENTIAL_JSON: credential.json
        run: |
          set -o pipefail
          # This checkout is the repository to push *from*: the script needs a HEAD, not
          # the deployed copy. `--dry-run` is what makes that harmless.
          bash scripts/verify-push-credential.sh . 2>&1 | tee credential.txt

      # A red job is not the same as a refused credential: a step that timed out asked
      # nothing. This records which it was, as output rather than prose, so the issue can
      # name the refusal — or say that nothing was asked.
      - name: Record what the check found, for the alert
        id: report
        if: ${{ always() }}
        env:
          REPORT_FILE: credential.json
        run: node scripts/credential-alert.js --outputs >> "$GITHUB_OUTPUT"

      - name: Publish the verdict to the run summary
        if: ${{ always() }}
        run: |
          {
            echo "### The publish credential"
            echo
            echo '```'
            cat credential.txt 2>/dev/null || echo "The check produced no output."
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  # One issue per repository, opened on the first red run, commented while it stays red,
  # and commented on and closed by the first run that passes. The decision and the text
  # come from scripts/credential-alert.js, so the workflow cannot open an issue for a run
  # that never asked, close one on a run that did not look, or name a refusal the check
  # did not report.
  #
  # The step below is executed, not just described: `npm run test:credential` reads this
  # `run:` block out of the file and drives it against a stubbed `gh`, so an edit here
  # that would call gh with an unset variable, drop the label or file a second issue
  # fails on the branch. Keep the step self-contained and the `env:` keys it reads.
  alert:
    name: Report a credential that cannot publish
    runs-on: ubuntu-latest
    needs: [credential]
    # always(): this job reports on the check's outcome, so it has to run after a
    # failure — the very case it exists for.
    if: ${{ always() }}
    concurrency:
      group: publish-credential-alert
      cancel-in-progress: false
    permissions:
      contents: read
      issues: write
    steps:
      - name: Check out HealthClassEstimator
        uses: actions/checkout@v4

      - name: Open, update or close the tracking issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          OWNER: ${{ github.repository_owner }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          HEAD_SHA: ${{ github.sha }}
          EVENT: ${{ github.event_name }}
          DEPLOYED_REPO: richardparslow-commits/health_app.py
          RESULT: ${{ needs.credential.result }}
          CODE: ${{ needs.credential.outputs.code }}
          DETAIL: ${{ needs.credential.outputs.detail }}
          ERROR: ${{ needs.credential.outputs.error }}
        run: |
          set -euo pipefail
          label=publish-credential

          # success / failure / cancelled / skipped: only a red run is reported, and a
          # cancelled or skipped one is left alone because it never asked.
          state=$(node scripts/credential-alert.js --state)
          echo "Publish credential: ${state}"
          if [ "$state" = "unknown" ]; then
            echo "The job did not finish (${RESULT}), so the issue is left as it is."
            exit 0
          fi

          gh label create "$label" --repo "$REPO" --force \
            --description "The credential the release publishes with cannot push" \
            --color B60205

          open_issues=$(gh issue list --repo "$REPO" --label "$label" --state open --json number --jq '.[].number')
          # sed, not head: `printf | head` can die of SIGPIPE under pipefail.
          issue=$(printf '%s\n' "$open_issues" | sed -n '1p')

          if [ "$state" = "failing" ]; then
            if [ -z "$issue" ]; then
              body=$(mktemp)
              node scripts/credential-alert.js --body > "$body"
              gh issue create --repo "$REPO" --label "$label" \
                --title "Publish credential: the release cannot push" \
                --body-file "$body"
            else
              gh issue comment "$issue" --repo "$REPO" \
                --body "$(node scripts/credential-alert.js --comment)"
            fi
          elif [ -n "$issue" ]; then
            closed_comment=$(node scripts/credential-alert.js --closed-comment)
            for n in $open_issues; do
              gh issue comment "$n" --repo "$REPO" --body "$closed_comment"
              gh issue close "$n" --repo "$REPO"
            done
          fi
